name: Atualiza dados de reserva

on:
  schedule:
    - cron: '30 2 * * *' # todo dia às 23:30 (horário de Brasília), depois dos sorteios
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/update-fallback.mjs
      - name: Commit se houver mudança
        run: |
          git add web/data
          if git diff --cached --quiet; then
            echo "Sem concursos novos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza dados de reserva com os concursos mais recentes"
          git push
